apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: easypg-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    # Optional: rate limiting for traffic control
    nginx.ingress.kubernetes.io/limit-rps: "50"
    nginx.ingress.kubernetes.io/limit-connections: "20"
spec:
  rules:
  - host: easypg.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 3000
  - host: api.easypg.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              number: 4000

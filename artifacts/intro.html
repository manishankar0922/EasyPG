<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EasyPG · Security Hardened</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }

    .wrapper {
      position: relative;
      display: inline-flex;
      align-items: center;
    }

    /* The text that types in */
    .text {
      font-size: clamp(1.4rem, 4vw, 2.2rem);
      font-weight: 400;
      color: #111111;
      letter-spacing: -0.01em;
      white-space: nowrap;
      overflow: hidden;
      width: 0;
      animation: type-in 0.9s cubic-bezier(0.4, 0, 0.2, 1) 0.15s forwards;
    }

    /* Blinking cursor */
    .cursor {
      width: 2px;
      height: 1.1em;
      background: #111111;
      display: inline-block;
      margin-left: 3px;
      border-radius: 1px;
      animation:
        blink 0.7s step-end infinite,
        cursor-fade 0.3s ease 1.4s forwards;
      vertical-align: middle;
      flex-shrink: 0;
    }

    @keyframes type-in {
      from { width: 0; }
      to   { width: 14ch; }  /* matches "EasyPG Secure" length */
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0; }
    }

    @keyframes cursor-fade {
      to { opacity: 0; }
    }
  </style>
  <!-- Preconnect for Inter if online; gracefully falls back to system font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" />
</head>
<body>
  <div class="wrapper">
    <span class="text" aria-label="EasyPG Secure">EasyPG Secure</span>
    <span class="cursor" aria-hidden="true"></span>
  </div>
</body>
</html>
